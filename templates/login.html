<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title id="pageTitle">Social Empires ~ Launcher</title>
    <link rel="shortcut icon" href="img/icon.gif"/>
    <link rel="icon" type="image/png" href="img/icon.gif"/>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            --card-bg: rgba(15, 23, 42, 0.75);
            --accent-gold: #fbbf24;
            --accent-gold-hover: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glow: 0 0 15px rgba(251, 191, 36, 0.2);
            --glow-active: 0 0 25px rgba(251, 191, 36, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient floating particles */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(251, 191, 36, 0.05);
            border-radius: 50%;
            top: 20%;
            left: 15%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(59, 130, 246, 0.05);
            border-radius: 50%;
            bottom: 10%;
            right: 15%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            z-index: 10;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 50px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: rgba(251, 191, 36, 0.15);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.6), var(--glow);
        }

        .logo-container {
            margin-bottom: 25px;
            position: relative;
            display: inline-block;
        }

        .logo-container img {
            width: 160px;
            filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.3));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fff 0%, #e2e8f0 50%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .title img {
            filter: drop-shadow(0 0 5px var(--accent-gold));
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 35px;
            font-weight: 300;
        }

        .form-group {
            text-align: left;
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-label img {
            opacity: 0.8;
        }

        .select-wrapper {
            position: relative;
        }

        select {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 16px;
            font-family: inherit;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.15);
        }

        .select-wrapper::after {
            content: '▼';
            font-size: 10px;
            color: var(--text-muted);
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .tip-box {
            font-size: 12px;
            color: var(--text-muted);
            font-style: italic;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #d97706 100%);
            border: none;
            border-radius: 10px;
            padding: 14px 24px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(251, 191, 36, 0.4);
            background: linear-gradient(135deg, #fcd34d 0%, var(--accent-gold-hover) 100%);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 30px 0;
            position: relative;
        }

        .divider::after {
            content: 'OR';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #151f32;
            padding: 0 10px;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .create-empire-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .create-empire-link:hover {
            color: #fff;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.5);
            text-decoration: none;
        }

        .create-empire-link img {
            transition: transform 0.2s ease;
        }

        .create-empire-link:hover img {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo-container">
                <img src="img/logo.png" alt="Social Empires Logo"/>
            </div>

            <div class="title">
                <img src="img/sword.png" height="22px" alt="Sword"/>
                <span>Social Empires</span>
            </div>
            <div class="subtitle">By the Social Emperors team ~ {{ version | default("?") }}</div>

            {% if saves_info %}
            <form method="post">
                <!-- VILLAGE SELECTION -->
                <div class="form-group">
                    <label class="form-label" for="USERID">
                        <img src="img/villager.png" style="height: 18px;" alt="Villager"/>
                        <span>Select a village</span>
                    </label>
                    <div class="select-wrapper">
                        <select id="USERID" name="USERID" required>
                            {% for save in saves_info %}
                            <option value="{{save.userid}}">{{save.name}} ~ level {{save.level}} ({{save.xp}} xp)</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <!-- RELEASE SELECTION -->
                <div class="form-group">
                    <label class="form-label" for="GAMEVERSION">
                        <img src="img/knight.png" style="height: 18px;" alt="Knight"/>
                        <span>Game version</span>
                    </label>
                    <div class="select-wrapper">
                        <select id="GAMEVERSION" name="GAMEVERSION" required>
                            <option value="SocialEmpires0926bsec.swf">0.9.26b (Working)</option>
                            <option value="SocialEmpires1.1.5sec.swf">1.1.5 (Experimental)</option>
                            <option value="SocialEmpires1.4.07sec.swf">1.4.07 (Broken)</option>
                        </select>
                    </div>
                    <div class="tip-box">
                        <span>💡 Tip: 0.9.26b contains legacy Troll Missions!</span>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <span>Log in to Empire</span>
                </button>
            </form>
            <div class="divider"></div>
            {% endif %}

            <a href="/new.html" class="create-empire-link">
                <img src="img/icon.gif" height="18px" alt="Gold Icon"/>
                <span>Create a new empire</span>
            </a>
        </div>
    </div>
</body>
</html>
