<!DOCTYPE html>
<html lang="en">
<head>
	<!-- Meta -->
	<meta charset="utf-8" />
	<!-- Title and Icon -->
	<title id="pageTitle">Social Empires</title>
	<link rel="shortcut icon" href="/img/icon.gif" />
	<link rel="icon" type="image/png" href="/img/icon.gif" />
	<!-- CSS -->
	<link rel="stylesheet" href="css/facebook.css" />
</head>
<body class="ego_wide canvas center_fixed_width_app fbx UIPage_LoggedOut liquid hideBanner Locale_en_US" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); overflow: auto;">
	<center><img src="/img/logo.png" style="width: 200px;" /></center>
	<div class="mvl ptm uiInterstitial canvas_error_page uiInterstitialLarge uiBoxWhite">
		<!-- HEAD TITLE -->
		<div class="uiHeader uiHeaderBottomBorder mhl mts uiHeaderPage interstitialHeader">
			<div class="clearfix uiHeaderTop">
				<div>
					<img src="/img/sword.png" height="18px" style="margin-left: 5px;">
					<h2 class="uiHeaderTitle" aria-hidden="true" style="margin-left: 2px; display: inline-block;">
						<a href="/" style="text-decoration: none;">Social Empires </a>
					</h2>
					<p style="display: inline-block; margin: 0 0 4px 6px;">By the Social Emperors team ~ {{ version | default("?")}}</p>
				</div>
			</div>
		</div>
		<!-- LOGIN CONTENT -->
		<div class="phl ptm uiInterstitialContent" style="overflow: auto; display: inblock;">
			<br>
			<div style="margin-left:20px; font-size:13px; float: left;">
				<form method="post" action="/reg/new">
					<!-- NEW PLAYER REGISTRATION -->
					<b>Create a New Save</b>
					<br><br>
					<div style="float: left">
						<label>Player Name:</label>
						<input type="text" id="playername" name="playername" placeholder="Emperor" minlength="3" maxlength="16" required/>
						<br><br>
						<input type="checkbox" id="skiptutorial" name="skiptutorial" value="skiptutorial" checked/>
						<label>Skip Tutorial</label>
						<br>
						<label>Starting Draggy:</label>
						<select id="STARTING_DRAGGY" name="STARTING_DRAGGY" style="height: 24px;" required>
							<option value="GREEN">Green Draggy</option>
							<option value="BLUE">Lightning Draggy</option>
							<option value="GOLD">Golden Draggie</option>
						</select>
						<br><br>
					</div>
					<div style="float: left">
						<!-- RUNNER  SELECTION -->
						<b>Flash Client</b>
						<br><br>
						<div style="overflow: auto; display: inblock;">
							<div style="float: left">
								<div style="float: left; margin-right: 4px;">
									<img src="/img/sword.png" style="height: 27px; margin-top: 0px;">
								</div>
								<div style="float: left">
									<select id="RUNNER" name="RUNNER" style="height: 24px;" required>
										<option value="FLASH">Use Flash Player</option>
										<option value="RUFFLE">Ruffle (Experimental)</option>
									</select>
								</div>
								<br><br> <i>Note: Ruffle works on modern web browsers but may be slow or broken!</i>
								<br><br>
							</div>
						</div>
						<!-- RELEASE SELECTION -->
						<b>Game version</b>
						<br><br>
						<div style="overflow: auto; display: inblock;">
							<div style="float: left">
								<div style="float: left; margin-right: 4px;">
									<img src="/img/knight.png" style="height: 27px; margin-top: 0px;">
								</div>
								<div style="float: left">
									<select id="GAMEVERSION" name="GAMEVERSION" style="height: 24px;" required>
										<option value="SocialEmpires1.4.07sec_fixed.swf">1.4.07 (Latest)</option>
										<option value="SocialEmpires0926bsec.swf">0.9.26b</option>
									</select>
								</div>
								<br><br>
							</div>
							<div style="float: right;">
								<button type="submit" style="font-size:14px; height: 25px">Create Empire</button>
							</div>
						</div>
					</div>
				</form>
				<br>
			</div>
		</div>
	</div>
</body>
</html>
